[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vasool-raja"
version = "0.6.2"
description = "A Regulatory Digital Twin for Indian bank customers — runs the RBI rulebook on a statement, finds money owed, prepares and tracks the complaint."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Mad Angles, Coimbatore Institute of Technology"}]
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9", "pydantic>=2.5", "pdfplumber>=0.11", "pytesseract>=0.3.10", "Pillow>=10.0", "python-dateutil>=2.8", "openpyxl>=3.1"]

[project.scripts]
vasool = "vasool.__main__:main"

[tool.setuptools.packages.find]
include = ["vasool*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
